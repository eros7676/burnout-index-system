name: Empresas de la demo con Docker
# The README path for a new teammate, end to end: Docker, the copied .env files, the app, and
# demo:cargar for the three companies, then again (idempotent) and with --reiniciar.
on:
  pull_request:
    paths:
      - docker-compose.yml
      - docker/**
      - .env.example
      - NexusProject/nexus-project/.env.example
      - NexusProject/nexus-project/prisma/**
      - NexusProject/nexus-project/scripts/demo-empresas.mjs
      - NexusProject/nexus-project/templates/empresas/**
      - .github/workflows/demo-empresas.yml
  workflow_dispatch:
jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: NexusProject/nexus-project
    steps:
      - uses: actions/checkout@v4
      - name: MySQL as in the README
        working-directory: .
        run: cp .env.example .env && docker compose up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NexusProject/nexus-project/package-lock.json
      - run: cp .env.example .env && npm ci && npm run db:generate && npm run build
      - name: Start the app
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:3000/ && exit 0; sleep 2; done
          exit 1
      - name: Load the three companies
        run: npm run demo:cargar
      - name: Load again, every file is already there
        run: |
          npm run demo:cargar | tee "$RUNNER_TEMP/segunda.log"
          test "$(grep -c 'ya estaba cargado' "$RUNNER_TEMP/segunda.log")" -eq 9
      - name: Empty and load again, with the app running
        run: |
          npm run demo:cargar -- --reiniciar | tee "$RUNNER_TEMP/reinicio.log"
          test "$(grep -c 'filas nuevas' "$RUNNER_TEMP/reinicio.log")" -eq 9
      - name: App log
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"
